name: Android Debug Build
on:
  push:
    branches: [main, "architecture/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Android build attempt ${attempt}/3"
            if gradle --no-daemon :app:assembleDebug; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "Build failed; waiting before retry..."
              sleep $((attempt * 20))
            fi
          done
          exit 1
