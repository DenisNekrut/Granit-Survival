name: Android Debug Build
on:
  push:
    branches: [main, "architecture/**", "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Android build attempt ${attempt}/3"
            if gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "Build failed; waiting before retry..."
              sleep $((attempt * 20))
            fi
          done
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GranitSurvival-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
